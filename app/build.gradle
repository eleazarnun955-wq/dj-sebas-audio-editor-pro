plugins { id 'com.android.application' }

android {
    namespace 'com.djsebas.audioeditor'
    compileSdk 35
    defaultConfig {
        // ID exclusivo para evitar choques con instalaciones anteriores y conservarlas intactas.
        applicationId 'com.djsebas.audioeditor.mp3edition'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
}
